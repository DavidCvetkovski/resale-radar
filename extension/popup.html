<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --muted: #777; --line: #8884; --ok: #1a7f37; --warn: #c26b00; --hot: #d00000; }
  body { font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; width: 340px; margin: 0; padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 6px; margin: 8px 0; }
  .event { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 8px 0; position: relative; }
  .event a { font-weight: 600; color: inherit; display: block; padding-right: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .event .info { color: var(--muted); margin-top: 2px; }
  .event .info.ok.hot { color: var(--hot); font-weight: 600; }
  .event .info.blocked, .event .info.error, .event .info.limited { color: var(--warn); }
  .event button { position: absolute; top: 6px; right: 6px; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 15px; }
  input[type=text], input[type=email] { flex: 1; min-width: 0; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  input[type=number] { width: 56px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .buttons { display: flex; gap: 8px; margin-top: 12px; }
  .buttons button, form button { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: none; font: inherit; cursor: pointer; }
  .buttons button.primary { background: #ff6a00; border-color: #ff6a00; color: white; }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0; }
  code { font-size: 11px; user-select: all; }
  #msg { min-height: 1.4em; margin: 10px 0 0; }
</style>
</head>
<body>
  <h1>🎟️ Resale Radar</h1>
  <label class="row"><input type="checkbox" id="enabled"> Checking is on</label>
  <div class="row">Every <input type="number" id="minSeconds" min="30" step="1"> to <input type="number" id="maxSeconds" min="30" step="1"> sec, at random</div>
  <p class="hint" id="next"></p>
  <div id="events"></div>
  <form id="add" class="row"><input type="text" id="newUrl" placeholder="Paste another TicketSwap event link"><button>Add</button></form>
  <label class="row">Email to <input type="email" id="email"></label>
  <p class="hint">Phone push too: in the free ntfy app, subscribe to <code id="topic"></code></p>
  <p class="hint" id="helper"></p>
  <p class="hint">Keep Chrome open and the Mac awake. Checks happen in the pinned TicketSwap tab.</p>
  <div class="buttons"><button id="check" class="primary">Check now</button><button id="dashboard">Open dashboard</button><button id="test">Test alarm</button></div>
  <p id="msg"></p>
  <script src="popup.js"></script>
</body>
</html>
